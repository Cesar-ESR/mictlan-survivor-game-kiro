    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>mictlan-game</title>
    <style>
      @font-face {
        font-family: 'PixelOperator';
        src: url('./src/assets/Fonts/pixel-operator/PixelOperator8.ttf') format('truetype');
